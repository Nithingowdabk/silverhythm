<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authorized Access | Management Suite</title>
    <link rel="stylesheet" href="css/admin-portal.css?v=2">
    <link rel="icon" href="/assets/Logo.png" type="image/png">
</head>
<body class="login-body">

    <div class="login-card">
        <img src="assets/Logo.png" alt="Devaramane" class="login-logo">
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Management Suite Access</p>

        <div id="loginError" class="status-badge status-cancelled" style="width:100%; margin-bottom:1.5rem; justify-content:center; padding:0.75rem;"></div>

        <form onsubmit="return false;">
            <div class="form-group" style="text-align:left;">
                <label>Username / Email</label>
                <input type="text" id="email" placeholder="Silverhythm or admin@example.com" required style="width:100%;" autocomplete="username">
            </div>
            <div class="form-group" style="text-align:left; margin-bottom:2rem;">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required style="width:100%;" autocomplete="current-password">
            </div>

            <button type="button" id="loginBtn" class="btn-accent" style="width:100%; justify-content:center;">
                Log In
            </button>
        </form>

        <div class="login-footer">
            © 2026 DEVARAMANE · SILVERHYTHM · UDUGORE
        </div>
    </div>

    <script src="js/admin-login.js?v=2"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</body>
</html>
