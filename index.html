      "url": "https://silverhythm.com",
      "logo": "https://silverhythm.com/assets/Logo.png",
      "contactPoint": {

        "availableLanguage": ["English", "Kannada"]
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "70/5 Vani Vilas Road, Basavanagudi",

      },

    }

    <!-- Skip Link -->

        <!-- Brand Specific Section (Collections / Occasions) -->

        <!-- Brand Story / Heritage -->
        <section id="story-section"></section>


        <!-- Features Grid -->

        <!-- Testimonials -->
        <section id="testimonials-section"></section>




        <!-- Contact (Silverhythm only) -->
        <div id="brand-closing-wrap">
            <section id="contact-section"></section>
            <footer id="site-footer"></footer>

    <!-- Modal Root (product modal, auth modal rendered here) -->
    <div id="modal-root"></div>

    <!-- WhatsApp FAB -->
    <a id="wa-fab" href="#" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp"></a>

    <!-- Full-Screen Search Modal -->
    <div id="search-modal" class="search-modal">
        <div class="search-header">
            <input type="text" id="searchInput" class="search-input" placeholder="Search for products...">
            <button id="closeSearchBtn" aria-label="Close search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </button>
        </div>
        <div id="searchResults" class="search-results"></div>
    </div>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav"></nav>

    <!-- Application Entry Point -->
    <script type="module" src="js/app.js?v=14"></script>
